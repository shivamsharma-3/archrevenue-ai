  <!-- Arrowhead -->
  <polygon points="72,22 63,26 68,34" fill="#6366F1"/>
  <!-- Crosshair lines -->
  <line x1="50" y1="40" x2="50" y2="44" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="50" y1="60" x2="50" y2="64" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="38" y1="52" x2="42" y2="52" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="58" y1="52" x2="62" y2="52" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>
