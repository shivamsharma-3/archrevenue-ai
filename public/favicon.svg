<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#0F172A"/>
  <!-- Radar rings -->
  <circle cx="50" cy="52" r="34" stroke="#6366F1" stroke-width="2.5" opacity="0.35"/>
  <circle cx="50" cy="52" r="22" stroke="#6366F1" stroke-width="2.5" opacity="0.55"/>
  <circle cx="50" cy="52" r="10" stroke="#6366F1" stroke-width="2.5" opacity="0.85"/>
