<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="fav-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="fav-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark tile background with rounded corners -->
  <rect width="100" height="100" rx="22" fill="#0A0F1D"/>
  <rect x="1" y="1" width="98" height="98" rx="21" stroke="#1E293B" stroke-width="2"/>
  <rect x="2" y="2" width="96" height="48" rx="20" fill="url(#fav-glow)"/>

  <!-- RevScout Precision Faceted Delta (bold & crystal-clear at 16x16) -->
  <g transform="translate(0, 1)">
    <!-- Left Wing -->
    <path d="M 50 16 L 20 84 L 38 84 L 50 50 Z" fill="url(#fav-left)"/>
    <!-- Right Wing -->
    <path d="M 50 16 L 50 50 L 62 84 L 80 84 Z" fill="url(#fav-right)"/>
    <!-- Center Apex Highlight -->
    <circle cx="50" cy="50" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
